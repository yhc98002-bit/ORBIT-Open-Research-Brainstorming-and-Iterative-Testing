schema_version: "0.1"

profiles:
  orbit-core:
    public:
      - orbit-status
      - idea-to-proposal
      - experiment-bridge
      - diagnostic-to-review
      - proposal-revise
      - import-codex-review
    internal:
      - research-lit
      - idea-discovery
      - research-refine
      - experiment-plan
      - run-experiment
      - analyze-results
      - result-to-claim
      - auto-review-loop
  paper-pack:
    public:
      - paper-draft
      - paper-from-claims
      - submission-package
    internal:
      - paper-plan
      - paper-figure
      - paper-write
      - paper-compile
      - auto-paper-improvement-loop
      - paper-claim-audit
      - citation-audit
  research-paper:
    public:
      - orbit-status
      - idea-to-proposal
      - experiment-bridge
      - diagnostic-to-review
      - paper-draft
      - paper-from-claims
      - submission-package
      - import-codex-review
    internal:
      - proposal-revise
      - research-lit
      - idea-discovery
      - research-refine
      - experiment-plan
      - run-experiment
      - analyze-results
      - result-to-claim
      - auto-review-loop
      - paper-plan
      - paper-figure
      - paper-write
      - paper-compile
      - auto-paper-improvement-loop
      - paper-claim-audit
      - citation-audit
  patent-pack:
    public:
      - patent-pipeline
    internal:
      - prior-art-search
      - claims-drafting
      - specification-writing
  presentation-pack:
    public:
      - paper-slides
      - paper-poster
      - grant-proposal
    internal: []
  infra-pack:
    public:
      - run-experiment
      - vast-gpu
      - serverless-modal
      - experiment-queue
    internal: []

mirror_policy:
  canonical_root: skills
  full_mirrors:
    - .agents/skills
    - skills/skills-codex
  overlays:
    - path: skills/skills-codex-gemini-review
      kind: review-overlay
      skills:
        - auto-paper-improvement-loop
        - auto-review-loop
        - grant-proposal
        - idea-creator
        - idea-discovery
        - idea-discovery-robot
        - novelty-check
        - paper-figure
        - paper-plan
        - paper-poster
        - paper-slides
        - paper-write
        - paper-writing
        - research-refine
        - research-review
    - path: skills/skills-codex-claude-review
      kind: review-overlay
      skills:
        - auto-paper-improvement-loop
        - auto-review-loop
        - novelty-check
        - paper-figure
        - paper-plan
        - paper-write
        - research-refine
        - research-review

